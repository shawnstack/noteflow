# NoteFlow Electron 打包配置（electron-builder 26）
#
# asar: false 的原因 —— Electron 主进程要 dynamic import 磁盘上的
# server-core.mjs / node_modules/@shawnstack/quickforge（quickforge 内部
# 还会按文件路径读取 vendor/node-pty prebuilds），不进 asar 最省心；
# 本地工具不在乎那点体积差。
appId: app.noteflow.desktop
productName: NoteFlow
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - server-core.mjs
  - asset-endpoint.mjs
  - fs-endpoint.mjs
  - dist/**
  - package.json
  # 托盘图标随包携带（生产环境 build/ 不会整体打包）
  - build/icons/16x16.png
asar: false
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
# Windows：在 mac 上交叉打包 NSIS 需要 wine，
# 需要时执行 `electron-builder --win nsis --x64`。
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
# 文件关联（右键“打开方式”）：注册 ProgId + OpenWithProgids，
# NoteFlow 出现在 .md/.markdown 的“打开方式”列表，不抢占系统默认程序。
fileAssociations:
  - ext: md
    name: NoteFlow Markdown
    description: Markdown 文档
    role: Editor
  - ext: markdown
    name: NoteFlow Markdown
    description: Markdown 文档
    role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NoteFlow
# Linux：hicolor 尺寸集在 build/icons/（16-512 九档）。
linux:
  category: Office
  icon: build/icons
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
